<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Offline · NexusCode</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Shown by the service worker when a page can't be loaded. No scripts. -->
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --surface: #151b23; --border: #2a313c; --text: #e6edf3; --muted: #a3aebb; --accent: #58a6ff; --on-accent: #0b1220; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #ffffff; --surface: #f6f8fa; --border: #d8dee4; --text: #1f2328; --muted: #55606b; --accent: #0969da; --on-accent: #ffffff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; padding: 2rem; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { margin: 1rem 0 0.5rem; font-size: 22px; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.25rem; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>NexusCode needs a connection to load your projects. Nothing you saved is lost; reconnect and try again.</p>
    <a href="/dashboard">Try again</a>
  </main>
</body>
</html>
